name: Build macOS Qt App
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.10.3
        host: mac
        target: desktop
        arch: clang_64
    - name: Configure CMake
      run: |
        cmake -B build -S src -DCMAKE_BUILD_TYPE=Release
    - name: Build
      run: |
        cmake --build build --config Release
    - name: Deploy Qt libraries
      run: |
        macdeployqt build/Blerch.app
        codesign --deep --force --sign - build/Blerch.app
    - name: Package app
      run: |
        cd build
        ditto -c -k --sequesterRsrc --keepParent Blerch.app Blerch-macOS.zip
    - name: Upload app
      uses: actions/upload-artifact@v4
      with:
        name: Blerch-macOS
        path: build/Blerch-macOS.zip
